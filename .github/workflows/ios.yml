name: iOS
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
  application:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild -resolvePackageDependencies -project MoRead.xcodeproj -scheme MoRead
      - name: Build for iPhone
        run: xcodebuild -project MoRead.xcodeproj -scheme MoRead -sdk iphoneos -configuration Debug -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build
      - name: Test reader in simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if x["name"].startswith("iPhone")))')
          xcodebuild -project MoRead.xcodeproj -scheme MoRead -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/simulator -resultBundlePath build/ReadingTests.xcresult CODE_SIGNING_ALLOWED=NO test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MoRead-build-and-tests
          path: |
            build/ReadingTests.xcresult
            build/device/Build/Products/Debug-iphoneos/*.app
